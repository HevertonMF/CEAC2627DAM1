<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Taller de bicis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600&family=Barlow+Condensed:wght@600;800&display=swap" rel="stylesheet">
    <style>
      /* Colores: asfalto, cielo de mañana y el naranja de los chalecos de seguridad */
      :root{
        --fondo:#EEF2F5;
        --papel:#FFFFFF;
        --tinta:#15213B;
        --tinta-suave:#55607A;
        --linea:#C9D2DC;
        --naranja:#F26A1B;
        --naranja-oscuro:#C24E0C;
      }

      @media (prefers-color-scheme: dark){
        :root{
          --fondo:#121A2C;
          --papel:#1B2540;
          --tinta:#EEF2F5;
          --tinta-suave:#A7B1C6;
          --linea:#2E3A58;
          --naranja:#FF8A3D;
          --naranja-oscuro:#FFB07A;
        }
      }

      *{box-sizing:border-box;}

      body{
        margin:0;
        background:var(--fondo);
        color:var(--tinta);
        font-family:'Barlow', sans-serif;
        font-size:17px;
        line-height:1.5;
      }

      .tienda{
        display:grid;
        grid-template-columns:1fr 340px;
        gap:40px;
        max-width:1080px;
        margin:0 auto;
        padding:48px 20px;
      }

      /* Cabecera: el título es lo que se recuerda */
      header{grid-column:1 / -1;}

      h1{
        margin:0;
        font-family:'Barlow Condensed', sans-serif;
        font-weight:800;
        font-size:clamp(56px, 11vw, 120px);
        line-height:0.9;
        letter-spacing:-0.02em;
      }

      header p{
        margin:12px 0 0 0;
        max-width:46ch;
        color:var(--tinta-suave);
      }

      /* Lista de bicicletas: una fila por modelo, como una pizarra de precios */
      .productos{
        display:flex;
        flex-direction:column;
        border-top:2px solid var(--tinta);
      }

      .producto{
        display:flex;
        align-items:baseline;
        gap:16px;
        width:100%;
        padding:16px 4px;
        border:none;
        border-bottom:1px solid var(--linea);
        background:none;
        color:var(--tinta);
        font:inherit;
        text-align:left;
        cursor:pointer;
      }

      .producto .nombre{
        font-weight:600;
        font-size:19px;
      }

      .producto .tipo{
        color:var(--tinta-suave);
        font-size:15px;
      }

      .producto .precio{
        margin-left:auto;
        font-family:'Barlow Condensed', sans-serif;
        font-weight:600;
        font-size:24px;
      }

      .producto:hover .precio,
      .producto:focus-visible .precio{
        color:var(--naranja-oscuro);
      }

      .producto:hover .nombre{
        text-decoration:underline;
        text-decoration-color:var(--naranja);
        text-decoration-thickness:3px;
        text-underline-offset:4px;
      }

      button:focus-visible{
        outline:3px solid var(--naranja);
        outline-offset:2px;
      }

      /* Carrito */
      .carrito{
        align-self:start;
        position:sticky;
        top:20px;
        padding:24px;
        background:var(--papel);
        border-top:6px solid var(--naranja);
        border-radius:4px;
      }

      .carrito h2{
        margin:0 0 12px 0;
        font-family:'Barlow Condensed', sans-serif;
        font-weight:600;
        font-size:28px;
      }

      #detalle{
        margin:0;
        padding:0;
        list-style:none;
      }

      #detalle li{
        display:flex;
        align-items:center;
        gap:10px;
        padding:8px 0;
        border-bottom:1px solid var(--linea);
      }

      #detalle li span{flex:1;}

      .vacio{
        color:var(--tinta-suave);
      }

      .quitar{
        padding:4px 10px;
        border:1px solid var(--linea);
        border-radius:4px;
        background:none;
        color:var(--tinta-suave);
        font:inherit;
        font-size:14px;
        cursor:pointer;
      }

      .quitar:hover{
        border-color:var(--naranja);
        color:var(--naranja-oscuro);
      }

      .total{
        display:flex;
        align-items:baseline;
        justify-content:space-between;
        margin-top:16px;
      }

      #total{
        font-family:'Barlow Condensed', sans-serif;
        font-weight:800;
        font-size:48px;
        line-height:1;
      }

      /* Al añadir, la fila nueva se ilumina un momento */
      @keyframes nuevo{
        from{background:var(--naranja); color:white;}
        to{background:transparent;}
      }

      #detalle li.nuevo{animation:nuevo 0.6s ease-out;}

      @media (prefers-reduced-motion: reduce){
        #detalle li.nuevo{animation:none;}
      }

      /* Móvil */
      @media(max-width:760px){
        .tienda{grid-template-columns:1fr; gap:28px; padding:32px 16px;}
        .carrito{position:static;}
        .producto{flex-wrap:wrap; gap:4px 12px;}
        .producto .tipo{order:3; width:100%;}
      }
    </style>
  </head>
  <body>
    <div class="tienda">
      <header>
        <h1>Taller de bicis</h1>
        <p>Toca una bicicleta para añadirla al carrito. Puedes quitarla cuando quieras.</p>
      </header>

      <main class="productos">
        <button type="button" class="producto" value="350" nombre="Rockrider ST 520"><span class="nombre">Rockrider ST 520</span><span class="tipo">Montaña</span><span class="precio">350€</span></button>
        <button type="button" class="producto" value="450" nombre="Btwin Riverside 500"><span class="nombre">Btwin Riverside 500</span><span class="tipo">Híbrida</span><span class="precio">450€</span></button>
        <button type="button" class="producto" value="700" nombre="Giant Talon 2"><span class="nombre">Giant Talon 2</span><span class="tipo">Montaña</span><span class="precio">700€</span></button>
        <button type="button" class="producto" value="850" nombre="Merida Big.Nine 100"><span class="nombre">Merida Big.Nine 100</span><span class="tipo">Montaña</span><span class="precio">850€</span></button>
        <button type="button" class="producto" value="1000" nombre="Specialized Rockhopper"><span class="nombre">Specialized Rockhopper</span><span class="tipo">Montaña</span><span class="precio">1000€</span></button>
        <button type="button" class="producto" value="1200" nombre="Trek Marlin 7"><span class="nombre">Trek Marlin 7</span><span class="tipo">Montaña</span><span class="precio">1200€</span></button>
        <button type="button" class="producto" value="1500" nombre="Cannondale Trail 5"><span class="nombre">Cannondale Trail 5</span><span class="tipo">Montaña</span><span class="precio">1500€</span></button>
        <button type="button" class="producto" value="1800" nombre="Orbea Alma H30"><span class="nombre">Orbea Alma H30</span><span class="tipo">Montaña, rígida de competición</span><span class="precio">1800€</span></button>
        <button type="button" class="producto" value="2000" nombre="Canyon Grizl 7"><span class="nombre">Canyon Grizl 7</span><span class="tipo">Gravel</span><span class="precio">2000€</span></button>
        <button type="button" class="producto" value="3000" nombre="Scott Spark 960"><span class="nombre">Scott Spark 960</span><span class="tipo">Montaña, doble suspensión</span><span class="precio">3000€</span></button>
      </main>

      <aside class="carrito">
        <h2>Tu carrito</h2>
        <ul id="detalle"></ul>
        <div class="total">
          <span>Total</span>
          <span id="total">0€</span>
        </div>
      </aside>
    </div>

    <script>
      // Selecciono el escenario
      let escenario_total = document.querySelector("#total")
      let escenario_detalle = document.querySelector("#detalle")
      // Selecciono solo los botones de las bicis (no los de quitar)
      let botones = document.querySelectorAll(".producto")
      // Creo una variable que al principio vale cero
      let total = 0;
      // Creo una lista vacia para guardar los productos
      let lista = []

      // Pinto la lista y el total en el escenario
      function pintar(nuevo){
        escenario_detalle.innerHTML = ""
        if(lista.length == 0){
          escenario_detalle.innerHTML = '<li class="vacio">Tu carrito está vacío. Elige una bici de la lista.</li>'
        }
        lista.forEach(function(producto, indice){
          let fila = document.createElement("li")
          if(indice == nuevo){ fila.classList.add("nuevo") }
          let texto = document.createElement("span")
          texto.textContent = producto.nombre + " - " + producto.precio + "€"
          let quitar = document.createElement("button")
          quitar.type = "button"
          quitar.className = "quitar"
          quitar.textContent = "Quitar"
          quitar.setAttribute("aria-label", "Quitar " + producto.nombre)
          // Cuando hago click en quitar
          quitar.onclick = function(){
            // al total le resto lo que vale el producto
            total -= producto.precio
            // y lo saco de la lista
            lista.splice(indice, 1)
            pintar()
          }
          fila.appendChild(texto)
          fila.appendChild(quitar)
          escenario_detalle.appendChild(fila)
        })
        escenario_total.textContent = total + "€"
      }

      // Selecciono uno a uno
      botones.forEach(function(boton){
        // Cuando hago click en cada boton
        boton.onclick = function(){
          let producto = {
            nombre: boton.getAttribute("nombre"),
            precio: boton.getAttribute("value")*1 // Implicita
          }
          // A la lista le añado el producto
          lista.push(producto)
          // al total le sumo lo que vale el boton
          total += producto.precio
          pintar(lista.length - 1)
        }
      })

      pintar()
    </script>
  </body>
</html>
