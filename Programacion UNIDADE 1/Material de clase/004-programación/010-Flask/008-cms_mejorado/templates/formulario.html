<!doctype html>
<html lang="es">
  <head>
    <title>Nuevo artículo | Panel de administración</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
  </head>
  <body id="admin">
    <nav id="izquierda">
      <a href="/formulario" class="activo">Nuevo artículo</a>
      <a href="/tabla">Listado de artículos</a>
      <a href="/" class="ver-blog">Ver el blog</a>
      <a href="/logout" class="salir">Cerrar sesión</a>
    </nav>
    <div id="derecha">
      <h1>Nuevo artículo</h1>

      <form action="/inserta" method="POST" class="formulario">
        <label for="titulo">Título</label>
        <input type="text" name="titulo" id="titulo" maxlength="255" required>

        <label for="fecha">Fecha</label>
        <input type="date" name="fecha" id="fecha" required>

        <label for="contenido">Contenido</label>
        <textarea id="contenido" name="contenido" rows="10" required></textarea>

        <button type="submit">Publicar artículo</button>
      </form>
    </div>
  </body>
</html>
