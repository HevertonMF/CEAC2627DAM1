<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html,body{
        margin:0;
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        font-family:Calibri, 'Segoe UI', sans-serif;
        background:linear-gradient(135deg, #7A5A9E 0%, #A07FBE 45%, #6A4C93 100%);
      }
      div{
        width:320px;
        background:white;
        padding:40px 30px;
        border-radius:22px;
        display:flex;
        flex-direction:column;
        align-items:center;
        gap:10px;
        text-align:center;
        box-shadow:0 20px 50px rgba(30,15,60,0.35);
      }
      .icono{
        width:70px;
        height:70px;
        border-radius:50%;
        background:#D3E39A;
        color:#3A2A5C;
        font-size:36px;
        font-weight:bold;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      h1{
        margin:10px 0 0 0;
        font-size:24px;
        color:#3A2A5C;
      }
      p{
        margin:0;
        color:#5E5378;
        font-size:15px;
        line-height:1.5;
      }
      a{
        margin-top:15px;
        background:#D3E39A;
        color:#3A2A5C;
        padding:12px 28px;
        border-radius:999px;
        text-decoration:none;
        font-weight:bold;
      }
      a:hover{
        background:#C2D683;
      }
    </style>
  </head>
  <body>
    <div>
      <span class="icono">✓</span>
      <h1>¡Gracias!</h1>
      <p>Tu formulario ha sido recibido correctamente</p>
      <a href="/">Volver al inicio</a>
    </div>
  </body>
</html>
