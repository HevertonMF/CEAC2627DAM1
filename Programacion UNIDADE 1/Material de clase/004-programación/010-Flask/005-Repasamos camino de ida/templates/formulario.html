<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html,body{background:rgb(153, 42, 158);display:flex;width:100%;height:100%;
        align-items:center;justify-content:center;}
      form{border-radius:30px;width:250px;height:250px;background:white;padding:20px;display:flex;flex-direction:column;gap:10px;justify-content:center;}
    </style>
  </head>
  <body>
    <form method="POST" action="/recogedatos">
      <label for="nombre">Introduce el nombre del psicólogo</label>
      <input type="text" name="nombre" id="nombre">
      <label for="especialidad">Introduce la especialidad del psicólogo</label>
      <input type="text" name="especialidad" id="especialidad">
      <label for="numero_de_colegiado">Introduce el número de colegiado del psicólogo</label>
      <input type="text" name="numero_de_colegiado" id="numero_de_colegiado">
      <input type="submit">
    </form>
  </body>
</html>
