<!doctype html>
<html lang="es">
  <head>
    <title>Encuéntrame</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/estilo hecho sin ia.css">
  </head>
  <body>
    <header>
      <img src="https://hevertonmf.github.io/encuentrame/logo/simbolo-512.png">
      <h1>Encuéntrame</h1>
      <nav>
        <a href="/">Inicio</a>
        <a href="/sobrenosotros">Sobre nosotros</a>
        <a href="/proyectos">Proyectos</a>
        <a href="/contacto">Contacto</a>
      </nav>
      </header>
      <main>
        <form method="POST" action="/recibedatos">
          <label for="nombre">Introduce tu nombre</label>
          <input type="text" name="nombre" id="nombre">
          <label for="correo">Introduce tu correo</label>
          <input type="text" name="correo" id="correo">
          <label for="mensaje">Introduce tu mensaje</label>
          <textarea name="mensaje" id="mensaje"></textarea>
          <input type="submit">
        </form>
      </main>
      <footer>
        (c) 2026 Encuéntrame
      </footer>
    </div>
