<!doctype html>
<html lang="es">
  <head>
    <title>Encuéntrame</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/estilo hecho sin ia.css">
  </head>
  <body>
    <div id="contenedor">
      <header>
              <img src="https://hevertonmf.github.io/encuentrame/logo/simbolo-512.png">
        <h1>Encuéntrame</h1>
        <nav>
          <a href="/">Inicio</a>
          <a href="/sobrenosotros">Sobre nosotros</a>
          <a href="/proyectos">Proyectos</a>
          <a href="/contacto">Contacto</a>
        </nav>
      </header>
      <main>
        <h2>Proyectos</h2>
        {% for proyecto in proyectos %}
        	<article>
            <h3>{{proyecto.nombre}}</h3>
            <time>{{proyecto.fecha}}</time>
            <p>{{proyecto.descripcion}}</p>
        </article>
        {% endfor %}
      </main>
      <footer>
        (c) 2026 Encuéntrame
      </footer>
    </div>
  </body>
</html>
