{% extends "base.html" %}

{% block contenido %}
<section class="confirmacion">
  <div class="sello">✓</div>
  <h1>¡Película guardada!</h1>
  <p><strong>{{ titulo }}</strong> ya forma parte del catálogo.</p>

{% endblock %}
