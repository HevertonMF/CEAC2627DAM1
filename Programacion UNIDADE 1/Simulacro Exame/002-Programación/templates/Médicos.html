<!doctype html>
<html>
  <head>
    <title>Lista de Médicos</title>
    <meta charset="utf-8">
  </head>
  <body>
    <header>
      <h1>Hospital São Paulo</h1>
       <nav>
        <a href="/">Médicos</a>
        <a href="/formulario">Insertar médicos</a>
      </nav>
    </header>
    <main>
      {% for articulo in datos %}
      	<article>
        <h3>{{articulo.nombre}}</h3>
            <h3>{{articulo.apellidos}}</h3>
                <p>{{articulo.email}}</p>
                    <p>{{articulo.especialidad}}</p>
                        <p>{{articulo.numero_de_colegiado}}</p>
      </article>
      {% endfor %}
    </main>
    <footer>
    </footer>
  </body>
</html>
