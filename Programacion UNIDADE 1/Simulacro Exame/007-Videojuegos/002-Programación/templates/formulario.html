<!doctype html>
<html lang="es">
  <head>
    <title>videojuegos</title>
    <meta charset="utf-8">
  </head>
  <body>
    <header>
          <h1>videojuegos</h1>
        <nav>
        <a href="/">videojuegos</a>
        <a href="/formulario">Insertar videojuegos</a>
      </nav>
      </header>
      <main>
  <section class="tarjeta">
    <h2>Añadir a videojuegos</h2>
    <form method="post" action="/recibedatos" class="formulario">
      <label for="titulo">titulo</label>
      <input id="titulo" name="titulo">
      <label for="desarrollador">desarrollador</label>
      <input id="desarrollador" name="desarrollador">
      <label for="distribuidor">distribuidor</label>
      <input id="distribuidor" name="distribuidor">
      <label for="genero">genero</label>
      <input id="genero" name="genero">
      <label for="descripcion">descripcion</label>
      <input id="descripcion" name="descripcion">
      <label for="anio_lanzamiento">anio lanzamiento</label>
      <input id="anio_lanzamiento" name="anio_lanzamiento" type="number" step="any">
      <label for="fecha_lanzamiento">fecha lanzamiento</label>
      <input id="fecha_lanzamiento" name="fecha_lanzamiento">
      <label for="plataforma">plataforma</label>
      <input id="plataforma" name="plataforma">
      <label for="pais">pais</label>
      <input id="pais" name="pais">
      <label for="idioma">idioma</label>
      <input id="idioma" name="idioma">
      <label for="clasificacion_edades">clasificacion edades</label>
      <input id="clasificacion_edades" name="clasificacion_edades">
      <label for="presupuesto">presupuesto</label>
      <input id="presupuesto" name="presupuesto">
      <label for="ingresos">ingresos</label>
      <input id="ingresos" name="ingresos">
      <label for="valoracion_media">valoracion media</label>
      <input id="valoracion_media" name="valoracion_media">
      <label for="numero_valoraciones">numero valoraciones</label>
      <input id="numero_valoraciones" name="numero_valoraciones" type="number" step="any">
      <label for="unidades_vendidas">unidades vendidas</label>
      <input id="unidades_vendidas" name="unidades_vendidas" type="number" step="any">
      <label for="disponible">disponible</label>
      <input id="disponible" name="disponible">
      <label for="multijugador">multijugador</label>
      <input id="multijugador" name="multijugador">
      <label for="favorito">favorito</label>
      <input id="favorito" name="favorito">
      <label for="imagen_portada">imagen portada</label>
      <input id="imagen_portada" name="imagen_portada">
      <label for="url_trailer">url trailer</label>
      <input id="url_trailer" name="url_trailer">
      <label for="precio_original">precio original</label>
      <input id="precio_original" name="precio_original" type="number" step="any">
      <label for="precio_rebajado">precio rebajado</label>
      <input id="precio_rebajado" name="precio_rebajado" type="number" step="any">
      <label for="espacio_requerido">espacio requerido</label>
      <input id="espacio_requerido" name="espacio_requerido" type="number" step="any">
      <label for="compras_integradas">compras integradas</label>
      <input id="compras_integradas" name="compras_integradas">
      
      <button type="submit">Guardar</button>
   </form>
      </main>
      <footer>
        (C) 2026 videojuegos.com. Todos los derechos reservados.
      </footer>
    </div>
  </body>
</html>
