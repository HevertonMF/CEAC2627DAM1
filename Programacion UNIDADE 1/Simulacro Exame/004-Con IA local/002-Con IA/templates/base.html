<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Hospital São Paulo{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <header class="cabecera">
    <a class="marca" href="/">
      <span class="cruz" aria-hidden="true"></span>
      <span>
        <strong>Hospital São Paulo</strong>
        <small>Cuadro médico · Valencia</small>
      </span>
    </a>
    <nav>
      <a href="/" class="{{ 'activo' if pagina == 'consultor' }}">Consultor IA</a>
      <a href="/medicos" class="{{ 'activo' if pagina == 'medicos' }}">Médicos</a>
      <a href="/formulario" class="{{ 'activo' if pagina == 'formulario' }}">Alta de médico</a>
    </nav>
  </header>

  <main>
    {% block contenido %}{% endblock %}
  </main>

  <footer class="pie">
    © 2026 Hospital São Paulo · Simulacro de examen DAM · Datos ficticios
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
