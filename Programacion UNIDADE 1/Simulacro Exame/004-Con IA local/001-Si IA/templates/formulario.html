<!doctype html>
<html lang="es">
  <head>
    <title>Hospital São Paulo</title>
    <meta charset="utf-8">
    <link rel="stylesheet" href="static/médicos.css">
  </head>
  <body>
    <header>
          <h1>Hospital São Paulo</h1>
       <nav>
        <a href="/">Médicos</a>
        <a href="/formulario">Formulario</a>
      </nav>
      </header>
      <main>
        <form method="POST" action="/recibedatos">
          <label for="nombre">Nombre</label>
          <input type="text" name="nombre" id="nombre">
          <label for="apellidos">Apellidos</label>
          <input type="text" name="apellidos" id="apellidos">
          <label for="correo">Correo</label>
          <input type="text" name="correo" id="correo">
          <label for="especialidad">Especialidad</label>
          <input type="text" name="especialidad" id="especialidad">
          <label for="numero_de_colegiado">Número de colegiado</label>
          <input type="text" name="numero_de_colegiado" id="numero_de_colegiado">
          <input type="submit">
        </form>
      </main>
      <footer>
        (c) 2026 Hospital São Paulo
      </footer>
    </div>
  </body>
</html>
